name: Weekly Digest Generation

on:
  # Run every Monday at 8:00 UTC
  schedule:
    - cron: '0 8 * * 1'
  # Allow manual run from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write  # required to commit and push generated article + image

jobs:
  generate:
    name: Generate and publish article
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai-digest/package-lock.json

      - name: Install dependencies
        working-directory: ai-digest
        run: npm ci

      - name: Run content pipeline
        working-directory: ai-digest
        run: node scripts/generate.js
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Commit and push generated content
        working-directory: ai-digest
        run: |
          git config user.name "digest-bot"
          git config user.email "bot@littlebylittle.blog"
          git add src/content/blog/ src/assets/covers/
          git diff --cached --quiet || git commit -m "feat(content): weekly digest $(date +%Y-%m-%d)"
          git push
